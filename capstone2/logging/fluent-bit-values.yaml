kind: DaemonSet

config:
  service: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            On
        Labels              On

  outputs: |
    [OUTPUT]
        Name                loki
        Match               kube.*
        Host                loki.observability.svc.cluster.local
        Port                3100
        Labels              job=fluent-bit
        Label_Keys          $kubernetes['namespace_name'],$kubernetes['container_name']
        Line_Format         json
