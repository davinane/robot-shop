grafana:
  enabled: true
  persistence:
    enabled: false
  service:
    type: ClusterIP

prometheus:
  prometheusSpec:
    retention: 24h
    retentionSize: 2GB
    storageSpec: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    alertmanagerConfiguration:
      name: robot-shop-slack
    alertmanagerConfigSelector:
      matchLabels:
        release: monitoring

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false
